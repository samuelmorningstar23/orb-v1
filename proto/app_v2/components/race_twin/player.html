<!-- Orb v1 Race Twin player. Self-contained: no external assets, no network. Data is injected where the marker sits. -->
<style>
  :root { --bg: __BG__; --surface: __SURFACE__; --raised: __RAISED__; --border: __BORDER__; --text: __TEXT__; --text2: __TEXT2__; --live: __LIVE__; --decision: __DECISION__; --critical: __CRITICAL__; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: __FONT__; font-size: 12px; font-variant-numeric: tabular-nums; }
  .orb-twin { position: relative; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; outline: none; user-select: none; }
  .orb-twin:focus-visible { box-shadow: 0 0 0 2px var(--live) inset; }
  .orb-hud { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 12px 4px 12px; min-height: 40px; }
  .orb-hud .grow { flex: 1 1 auto; }
  .orb-title { color: var(--text2); letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
  .orb-title b { color: var(--text); font-weight: 600; }
  .orb-lap { font-size: 18px; font-weight: 600; }
  .orb-lap small { font-size: 11px; color: var(--text2); font-weight: 400; margin-left: 6px; }
  .orb-gap { font-size: 16px; font-weight: 600; }
  .orb-gap small { font-size: 11px; color: var(--text2); font-weight: 400; margin-left: 6px; }
  .orb-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text2); font-size: 11px; white-space: nowrap; }
  .orb-chip .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,.35); }
  .orb-chip.warn { border-color: var(--decision); color: var(--decision); }
  .orb-chip.crit { border-color: var(--critical); color: var(--critical); }
  .orb-chip.fixture { border-color: var(--decision); color: var(--decision); text-transform: uppercase; letter-spacing: .04em; }
  .orb-chip.hidden { display: none; }
  canvas.orb-canvas { display: block; width: 100%; background: var(--bg); }
  .orb-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 12px 8px 12px; border-top: 1px solid var(--border); background: var(--surface); }
  .orb-btn { background: var(--raised); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font: inherit; cursor: pointer; min-width: 34px; }
  .orb-btn:hover { border-color: var(--text2); }
  .orb-btn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .orb-btn[aria-pressed="true"] { border-color: var(--live); color: var(--live); }
  .orb-btn.play { min-width: 74px; font-weight: 600; }
  .orb-lapctl { display: flex; align-items: center; gap: 6px; flex: 1 1 180px; }
  .orb-lapctl input[type=range] { flex: 1 1 auto; accent-color: var(--live); min-width: 90px; }
  .orb-lapctl label { color: var(--text2); white-space: nowrap; }
  .orb-time { position: relative; height: 10px; flex: 1 1 100%; background: var(--raised); border-radius: 5px; cursor: pointer; overflow: hidden; }
  .orb-time .sc { position: absolute; top: 0; bottom: 0; background: rgba(240,184,75,.35); }
  .orb-time .fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--live); opacity: .75; }
  .orb-time .cursor { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
  .orb-hint { color: var(--text2); font-size: 10.5px; flex: 1 1 100%; }
  .orb-twin.present .orb-hint, .orb-twin.present .orb-fps, .orb-twin.present .orb-eng { display: none; }
  .orb-twin.present .orb-lap { font-size: 24px; } .orb-twin.present .orb-gap { font-size: 22px; }
  .orb-fps { color: var(--text2); font-size: 10.5px; margin-left: auto; }

  .orb-twin {background:#0d1824;border-color:#314656;border-radius:18px;box-shadow:inset 0 1px #ffffff08}
  .orb-hud {background:#11202d;padding:10px 16px 5px}.orb-title {font-size:10px;max-width:50%;letter-spacing:.025em}
  .orb-lap {font-size:17px;color:#d8e8f6}.orb-gap {color:#88e7d4}.orb-gap small {display:none}
  .orb-camera {display:flex;gap:6px;align-items:center;padding:7px 14px;background:#102030;justify-content:flex-end;border-bottom:1px solid #2a4050}
  .orb-camera .orb-btn {font-size:10px;padding:4px 9px;background:#1c3041;min-width:30px}
  .orb-controls {background:#142332;border-color:#2c4053;padding:9px 14px}.orb-btn.play {background:#99e6d7;color:#10262b;border-color:#99e6d7}
  .orb-chip {background:#192e3f;border-color:#354c60;padding:3px 8px;font-size:10px}.orb-eng{font-size:9px}
  canvas.orb-canvas {cursor:grab;touch-action:none}canvas.orb-canvas:active{cursor:grabbing}
</style>
<div id="orb-twin" class="orb-twin" tabindex="0" role="application" aria-label="Race Twin player: actual car and counterfactual ghost on the track map">
  <div class="orb-hud">
    <span class="orb-title"><b id="orb-ev"></b> <span id="orb-drv"></span></span>
    <span id="orb-src" class="orb-chip fixture hidden"></span>
    <span class="grow"></span>
    <span class="orb-lap"><span id="orb-lapno">—</span><small id="orb-clock">0:00</small></span>
    <span class="grow"></span>
    <span class="orb-gap" title="Ghost time minus actual time at this point in the selected simulation. Negative means the Ghost plan is ahead in modelled time."><span id="orb-gap">—</span><small id="orb-gapm"></small></span>
  </div>
  <div class="orb-hud" style="padding-top:0">
    <span class="orb-chip" id="orb-badge-a"><span class="dot"></span><span>Actual</span><span id="orb-a-txt"></span></span>
    <span class="orb-chip" id="orb-badge-g"><span class="dot"></span><span>Ghost</span><span id="orb-g-txt"></span></span>
    <span class="orb-chip warn hidden" id="orb-status"></span>
    <span class="orb-chip hidden" id="orb-pit-a">A in pit lane</span>
    <span class="orb-chip hidden" id="orb-pit-g">G in pit lane</span>
    <span class="orb-chip orb-eng" id="orb-halo" title="The 3D view uses recorded track coordinates. Road width, car size and height are visual styling, not surveyed measurements.">Recorded XY · schematic elevation</span>
    <span class="orb-chip orb-eng" id="orb-pitsrc"></span>
    <span class="orb-fps" id="orb-fps" aria-live="off"></span>
  </div>
  <div class="orb-camera" role="group" aria-label="3D camera controls">
    <button class="orb-btn" id="orb-view-3d" title="Orbit the recorded circuit in 3D. Road width and elevation are schematic.">3D</button>
    <button class="orb-btn" id="orb-view-top" title="Look straight down at the circuit.">Top</button>
    <button class="orb-btn" id="orb-rotate" title="Rotate the camera clockwise. You can also drag the track.">Rotate</button>
    <button class="orb-btn" id="orb-zoom-in" aria-label="Zoom in" title="Zoom in on the track.">+</button>
    <button class="orb-btn" id="orb-zoom-out" aria-label="Zoom out" title="Zoom out to see more of the circuit.">−</button>
    <button class="orb-btn" id="orb-camera-reset" title="Restore the starting 3D camera.">Reset view</button>
  </div>
  <canvas class="orb-canvas" id="orb-canvas" aria-hidden="true"></canvas>
  <div class="orb-controls">
    <button class="orb-btn play" id="orb-play" aria-label="Play or pause (space)">Play</button>
    <button class="orb-btn" id="orb-race-start" title="Rewind to the start without changing the chosen strategy.">Lap 1</button>
    <button class="orb-btn" id="orb-tyre-change" hidden title="Jump to the first lap on the Ghost’s replacement tyres.">Jump to tyre change</button>
    <span role="group" aria-label="Playback speed">
      <button class="orb-btn spd" data-v="1" aria-pressed="true">1x</button><button class="orb-btn spd" data-v="2" aria-pressed="false">2x</button><button class="orb-btn spd" data-v="5" aria-pressed="false">5x</button><button class="orb-btn spd" data-v="10" aria-pressed="false">10x</button>
    </span>
    <div class="orb-lapctl"><label for="orb-lapslider">lap</label><input type="range" id="orb-lapslider" min="1" max="1" value="1" step="1" aria-label="Lap scrubber"><span id="orb-lapval" style="min-width:24px">1</span></div>
    <div class="orb-time" id="orb-time" role="slider" aria-label="Race time" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><div class="fill" id="orb-fill"></div><div class="cursor" id="orb-cursor"></div></div>
    <div class="orb-hint">Drag to orbit · scroll to zoom · Space to play · ← → to step · Home / End to jump</div>
  </div>
</div>
